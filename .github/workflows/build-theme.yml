name: Build PS3 themes

on:
  push:
    branches: [main]
    paths: ["themes/**", "build_theme.py", ".github/workflows/build-theme.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # p3tcompiler.exe is a Windows program
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      # Sony's compiler is not copied into this repo. It is fetched from the theme-studio
      # project at build time, which bundles it unchanged.
      - name: Fetch p3tcompiler from mohasi/ps3-dev
        uses: actions/checkout@v4
        with:
          repository: mohasi/ps3-dev
          path: ps3-dev
          sparse-checkout: |
            tools/theme-studio/tools
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate assets (dry run)
        run: python build_theme.py --dry-run --out dry

      - name: Build .p3t files
        run: python build_theme.py --tools ps3-dev/tools/theme-studio/tools --out dist

      - name: Upload themes
        uses: actions/upload-artifact@v4
        with:
          name: ps3-m3-expressive-themes
          path: dist/*.p3t
          if-no-files-found: error
